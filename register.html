<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
VG GYM | Register
</title>


<!-- Bootstrap -->

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">


<!-- Font Awesome -->

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">


<!-- CSS -->

<link rel="stylesheet" href="css/style.css">


</head>


<body class="bg-dark">



<!-- ================= NAVBAR ================= -->


<nav class="navbar navbar-expand-lg navbar-dark bg-black">


<div class="container">


<a class="navbar-brand fw-bold fs-2 text-warning"
href="index.html">


<i class="fa-solid fa-dumbbell"></i>

VG GYM


</a>



<a href="login.html"
class="btn btn-warning">

Login

</a>


</div>


</nav>






<!-- ================= REGISTER SECTION ================= -->


<section class="py-5">


<div class="container">


<div class="row justify-content-center">



<div class="col-lg-7">



<div class="card shadow-lg border-0 rounded-4">



<div class="card-header bg-warning text-center py-4">


<h2 class="fw-bold">

Join VG GYM

</h2>


<p class="mb-0">

Start your fitness transformation today

</p>


</div>






<div class="card-body p-5">



<form action="payment.html">





<!-- Name -->


<div class="mb-3">


<label class="form-label fw-bold">

Full Name

</label>


<input type="text"
class="form-control"
placeholder="Enter your name"
required>


</div>






<!-- Email -->


<div class="mb-3">


<label class="form-label fw-bold">

Email Address

</label>


<input type="email"
class="form-control"
placeholder="Enter email"
required>


</div>






<!-- Phone -->


<div class="mb-3">


<label class="form-label fw-bold">

Mobile Number

</label>


<input type="tel"
class="form-control"
placeholder="Enter mobile number"
required>


</div>






<!-- Age Gender -->


<div class="row">


<div class="col-md-6 mb-3">


<label class="form-label fw-bold">

Age

</label>


<input type="number"
class="form-control"
placeholder="Your Age">


</div>




<div class="col-md-6 mb-3">


<label class="form-label fw-bold">

Gender

</label>


<select class="form-control">


<option>

Select Gender

</option>


<option>

Male

</option>


<option>

Female

</option>


<option>

Other

</option>


</select>


</div>


</div>






<!-- Address -->


<div class="mb-3">


<label class="form-label fw-bold">

Address

</label>


<textarea class="form-control"
rows="3"
placeholder="Enter address"></textarea>


</div>







<!-- Membership -->


<div class="mb-3">


<label class="form-label fw-bold">

Choose Membership Plan

</label>


<select class="form-control">


<option>

Select Plan

</option>


<option>

Basic - $999/month

</option>


<option>

Premium - $1,999/month

</option>


<option>

VIP - $2,999/month

</option>


</select>


</div>







<!-- Goal -->


<div class="mb-3">


<label class="form-label fw-bold">

Fitness Goal

</label>



<select class="form-control">


<option>

Select Goal

</option>


<option>

Weight Loss

</option>


<option>

Muscle Gain

</option>


<option>

Body Transformation

</option>


<option>

Fitness & Health

</option>


</select>


</div>








<!-- Password -->


<div class="row">


<div class="col-md-6 mb-3">


<label class="form-label fw-bold">

Password

</label>


<input type="password"
class="form-control"
placeholder="Create password"
required>


</div>






<div class="col-md-6 mb-3">


<label class="form-label fw-bold">

Confirm Password

</label>


<input type="password"
class="form-control"
placeholder="Confirm password"
required>


</div>


</div>








<!-- Terms -->


<div class="form-check mb-4">


<input class="form-check-input"
type="checkbox"
required>


<label class="form-check-label">

I agree to VG GYM terms and conditions

</label>


</div>








<button class="btn btn-warning btn-lg w-100 fw-bold">


Continue To Payment


</button>






</form>


</div>



</div>


</div>


</div>


</div>


</section>






<!-- ================= FOOTER ================= -->


<footer class="bg-black text-white py-4">


<div class="container text-center">


<h2 class="text-warning">

VG GYM

</h2>


<p>

Train Hard | Stay Strong | Never Quit

</p>


<p>

© 2026 VG GYM All Rights Reserved

</p>


</div>


</footer>






<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


</body>

</html>
