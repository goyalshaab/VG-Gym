<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
VG GYM | Login
</title>


<!-- Bootstrap -->

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">


<!-- Font Awesome -->

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">


<!-- CSS -->

<link rel="stylesheet" href="css/style.css">


</head>


<body class="bg-dark">





<!-- ================= NAVBAR ================= -->


<nav class="navbar navbar-dark bg-black">


<div class="container">


<a href="index.html"
class="navbar-brand fs-2 fw-bold text-warning">


<i class="fa-solid fa-dumbbell"></i>

VG GYM


</a>



<a href="register.html"
class="btn btn-warning">


Create Account


</a>



</div>


</nav>







<!-- ================= LOGIN SECTION ================= -->


<section class="py-5">


<div class="container">


<div class="row justify-content-center align-items-center min-vh-75">



<div class="col-lg-5">





<div class="card shadow-lg border-0 rounded-4">





<div class="card-header bg-warning text-center py-4">


<i class="fa-solid fa-user-circle fa-4x"></i>


<h2 class="fw-bold mt-3">

Member Login

</h2>


<p>

Welcome back to VG GYM

</p>


</div>







<div class="card-body p-5">



<form action="dashboard.html">





<!-- EMAIL -->


<div class="mb-4">


<label class="form-label fw-bold">

Email Address

</label>


<div class="input-group">


<span class="input-group-text">

<i class="fa fa-envelope"></i>

</span>



<input type="email"
class="form-control"
placeholder="Enter email"
required>


</div>


</div>








<!-- PASSWORD -->


<div class="mb-4">


<label class="form-label fw-bold">

Password

</label>


<div class="input-group">


<span class="input-group-text">

<i class="fa fa-lock"></i>

</span>



<input type="password"
class="form-control"
placeholder="Enter password"
required>


</div>


</div>







<!-- OPTIONS -->


<div class="d-flex justify-content-between mb-4">



<div class="form-check">


<input class="form-check-input"
type="checkbox">


<label class="form-check-label">

Remember Me

</label>


</div>





<a href="#"
class="text-warning text-decoration-none">


Forgot Password?


</a>



</div>







<!-- LOGIN BUTTON -->


<button class="btn btn-warning btn-lg w-100 fw-bold">


<i class="fa fa-sign-in-alt"></i>

Login


</button>





</form>







<!-- DIVIDER -->


<div class="text-center my-4">


<span>

OR LOGIN WITH

</span>


</div>







<!-- SOCIAL LOGIN -->


<div class="row g-3">


<div class="col-6">


<button class="btn btn-dark w-100">


<i class="fab fa-google"></i>

Google


</button>


</div>





<div class="col-6">


<button class="btn btn-primary w-100">


<i class="fab fa-facebook"></i>

Facebook


</button>


</div>



</div>







<hr class="my-4">





<p class="text-center mb-0">


Don't have an account?


<a href="register.html"
class="text-warning fw-bold">


Register Now


</a>


</p>






</div>



</div>




</div>


</div>


</div>


</section>







<!-- ================= FOOTER ================= -->


<footer class="bg-black text-white py-4">


<div class="container text-center">


<h2 class="text-warning">

VG GYM

</h2>


<p>

Train Hard | Stay Strong | Never Quit

</p>


<p>

© 2026 VG GYM. All Rights Reserved.

</p>


</div>


</footer>






<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


</body>


</html>
